{{- $secret := include "urumi-store.secretName" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "urumi-store.fullname" . }}-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi-store.componentLabels" (dict "ctx" . "component" "setup") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Keep the finished Job for `kubectl logs`; replace it on the next run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.setup.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.setup.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "urumi-store.componentLabels" (dict "ctx" . "component" "setup") | nindent 8 }}
      annotations:
        checksum/setup: {{ include (print $.Template.BasePath "/setup-configmap.yaml") . | sha256sum }}
    spec:
      restartPolicy: Never
      # The WordPress PVC is ReadWriteOnce on node-local storage: run next to the WordPress pod.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "urumi-store.componentSelector" (dict "ctx" . "component" "wordpress") | nindent 18 }}
      # The CLI image's www-data is uid 82; the Apache image (owner of the files) uses 33.
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ required "wordpress.runAsUser is required (upgrading with --reuse-values skips new chart defaults: use --reset-then-reuse-values)" .Values.wordpress.runAsUser }}
        runAsGroup: {{ required "wordpress.runAsUser is required (upgrading with --reuse-values skips new chart defaults: use --reset-then-reuse-values)" .Values.wordpress.runAsUser }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: setup
          image: "{{ .Values.setup.image.repository }}:{{ .Values.setup.image.tag }}"
          imagePullPolicy: {{ .Values.setup.image.pullPolicy }}
          command: ["sh", "/setup/setup.sh"]
          env:
            {{- include "urumi-store.wordpressEnv" . | nindent 12 }}
            - { name: HOME, value: /tmp }
            - { name: WP_CLI_CACHE_DIR, value: /tmp/wp-cli-cache }
            - { name: WP_HOME_URL, value: {{ include "urumi-store.homeUrl" . | quote }} }
            - { name: STORE_TITLE, value: {{ .Values.store.title | quote }} }
            - { name: STORE_COUNTRY, value: {{ .Values.store.country | quote }} }
            - { name: STORE_CURRENCY, value: {{ .Values.store.currency | quote }} }
            - { name: STORE_TIMEZONE, value: {{ .Values.store.timezone | quote }} }
            - { name: WP_ADMIN_USER, value: {{ .Values.store.adminUser | quote }} }
            - { name: WP_ADMIN_EMAIL, value: {{ .Values.store.adminEmail | quote }} }
            - { name: WOO_VERSION, value: {{ .Values.woocommerce.version | quote }} }
            - { name: WOO_KEY_DESCRIPTION, value: {{ .Values.woocommerce.apiKeyDescription | quote }} }
            - name: WP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: wp-admin-password }
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: woo-consumer-key }
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: woo-consumer-secret }
          resources:
            {{- toYaml .Values.setup.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: html, mountPath: /var/www/html }
            - { name: setup, mountPath: /setup, readOnly: true }
            - { name: tmp, mountPath: /tmp }   # HOME and the WP-CLI cache (plugin downloads)
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: {{ include "urumi-store.fullname" . }}-wordpress
        - { name: tmp, emptyDir: {} }
        - name: setup
          configMap:
            name: {{ include "urumi-store.fullname" . }}-setup
