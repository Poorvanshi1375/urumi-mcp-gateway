apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi-store.fullname" . }}-wordpress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi-store.componentLabels" (dict "ctx" . "component" "wordpress") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "urumi-store.componentSelector" (dict "ctx" . "component" "wordpress") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.wordpress.service.port }}
      targetPort: http
    {{- range .Values.wordpress.service.extraPorts }}
    - name: http-{{ . }}
      port: {{ . }}
      targetPort: http
    {{- end }}
