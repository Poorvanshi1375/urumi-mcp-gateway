apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "urumi-store.fullname" . }}-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi-store.componentLabels" (dict "ctx" . "component" "setup") | nindent 4 }}
data:
  setup.sh: |
    {{- .Files.Get "files/setup.sh" | nindent 4 }}
  api-key.php: |
    {{- .Files.Get "files/api-key.php" | nindent 4 }}
  products.txt: |
    {{- range .Values.store.seedProducts }}
    {{ .sku }}|{{ .name }}|{{ .price }}
    {{- end }}
