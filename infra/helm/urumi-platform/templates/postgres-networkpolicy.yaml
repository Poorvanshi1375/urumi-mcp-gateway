# Defence in depth: only the platform pods (gateway + its migrate init container, label app=platform
# of this release) may connect to Postgres. kubectl exec / port-forward go through the kubelet and
# are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "urumi-platform.postgresHost" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi-platform.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "urumi-platform.componentSelector" (dict "ctx" . "component" "postgres") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app: platform
        {{- if .Values.provisioner.enabled }}
        # The provisioner, as its own restricted role (urumi_provisioner).
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app: provisioner
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
