# k3d (urumi-local). Image tags come from infra/scripts/build-image.sh:
#   --set image.tag=<platform tag> --set wooMcp.image.tag=<woo-mcp tag> --set shipMcp.image.tag=<ship-mcp tag>
# The gateway is served at http://localhost:9080 (Node and curl resolve "localhost";
# "*.localhost" names are not resolvable by Node on WSL).
platform:
  ingress:
    host: localhost
  upstreamHealthIntervalMs: 5000
  # Stand-outs 3, 4 and 6 are on in the shipped values (the chart default is off).
  features:
    toolPinning: true
    toolSearch: true
    oauth: true
    validateArguments: true
  chat:
    confirmWrites: true   # chat asks before any write
    fallback:
      enabled: true       # Groq when Gemini fails (needs fallback-api-key in platform-llm)
  permissions:
    memberDefault: readOnly   # safe default for servers added later; explicit rules still win
  publicUrl: http://localhost:9080
  replicas: 2              # two gateway replicas behind Traefik (stateless MCP; shows load balancing)

wooMcp:
  store:
    signingBaseUrl: http://store.localhost:9080

# Created by scripts/secrets.sh, never by the chart.
secrets:
  existingSecret: platform-secrets

# The provisioner (hosted servers, bonus stores): the only pod with a Kubernetes token, fenced by
# RBAC and admission policies. Idle until its steps land (P5, P9).
provisioner:
  enabled: true
